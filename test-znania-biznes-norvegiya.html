<style>

.opt.correct .opt-letter{background:#5A9E2F;color:#fff}

<div class="intro" id="intro">

  <h1 class="intro-title">Обязаны ли вы регистрировать предприятие (ENK или AS) в Норвегии ?</h1>
  <p class="intro-sub">Многие думают что работают «просто так» — и попадают на штрафы. Проверьте свои знания о норвежских законах.</p>
  <p class="intro-meta">13 вопросов · Правильный ответ объясняется · Счёт в конце</p>
  <button class="btn-start" onclick="startQuiz()">Начать тест</button>

<div class="quiz" id="quiz"></div>
<div class="result" id="result"></div>

<script>
const questions = [
  {
    emoji:"🎂",
    text:"Маша печёт торты и продаёт их подружкам раз в год на день рождения. Нужно ли ей регистрировать ENK или AS ?",
    options:["Нет — раз в год без регулярности это хобби","Да — любая продажа требует ENK или AS","Да — но только если зарабатывает больше 50 000 kroner"],
    correct:0,tricky:false,
    explanation:{correct:"Правильно! Разовая продажа без регулярности и цели прибыли — хобби. Регистрировать ENK или AS не нужно. Но важно: даже с хобби налог платить надо если доход есть !",wrong:"Нет. Разовая продажа раз в год — хобби. ENK или AS не нужен. Но помните: даже с хобби доход нужно декларировать и платить налог !"}
  },
  {
    emoji:"💸",
    text:"Петя работает по найму и параллельно консультирует клиентов за наличные по вечерам. Нужен ли ему ENK или AS ?",
    options:["Да — регулярный дополнительный доход требует ENK или AS","Нет — у него уже есть работа и он платит налоги","Только если консультации приносят больше зарплаты"],
    correct:0,tricky:true,trickyNote:"Внимание — каверзный вопрос !",
    explanation:{correct:"Правильно! Наличие основной работы не освобождает от ENK или AS для дополнительной деятельности. Оба источника дохода декларируются — но по разным правилам.",wrong:"Нет. Наличие работодателя не освобождает от регистрации ENK или AS для дополнительной деятельности. Размер дохода не главный критерий — важна регулярность."}
  },
  {
    emoji:"🏠",
    text:"Лена сдаёт свою квартиру через Airbnb раз в год пока в отпуске и заработала 12 000 kroner. Нужно ли открывать ENK или AS ?",
    options:["Нет — но доход всё равно нужно декларировать","Да — любая аренда требует ENK или AS","Нет — до 50 000 kroner вообще ничего не нужно делать"],
    correct:0,tricky:false,
    explanation:{correct:"Правильно! До 15 000 kroner в год от сдачи собственного жилья — без налога. ENK или AS не нужен. Но декларировать нужно — с 2026 года Airbnb передаёт данные в Skatteetaten автоматически.",wrong:"Нет. Разовая сдача собственного жилья — не бизнес, ENK или AS не нужен. До 15 000 kroner — без налога. Но декларировать нужно обязательно."}
  },
  {
    emoji:"📱",
    text:"Катя ведёт Instagram в Норвегии и берёт рекламу у брендов из Молдовы. Нужно ли декларировать этот доход в Норвегии ?",
    options:["Нет — деньги приходят из Молдовы","Нет — это просто блог, не бизнес","Да — живёт в Норвегии, значит декларирует здесь весь доход"],
    correct:2,tricky:true,trickyNote:"Внимание — каверзный вопрос !",
    explanation:{correct:"Правильно! Если вы налоговый резидент Норвегии — весь доход декларируется здесь. Неважно откуда пришли деньги: из Молдовы, Германии или через PayPal.",wrong:"Нет. Живёте в Норвегии — декларируете здесь весь доход. Откуда он пришёл — не важно абсолютно."}
  },
  {
    emoji:"💅",
    text:"Оля делает маникюр клиентам у себя дома 3 раза в неделю и зарабатывает 20 000 kroner в месяц. Что ей нужно ?",
    options:["Только задекларировать доход — ENK или AS не нужен","Открыть ENK или AS и зарегистрировать помещение в коммуне","Ничего — это домашний бизнес, закон его не касается"],
    correct:1,tricky:false,
    explanation:{correct:"Правильно! Регулярные платные beauty-услуги — бизнес. Нужно ENK или AS + регистрация помещения в коммуне через Altinn. Одного ENK недостаточно — для услуг красоты на дому есть дополнительные требования.",wrong:"Нет. Регулярные платные услуги 3 раза в неделю = бизнес. Нужно ENK или AS + регистрация помещения в коммуне. Без этого — штрафы."}
  },
  {
    emoji:"🛍",
    text:"Света продаёт на Finn.no старые куртки, технику и мебель из своей квартиры. Это бизнес — нужен ENK или AS ?",
    options:["Да — продаёт и получает деньги","Да — но только если продаёт больше 10 вещей в год","Нет — продажа личных вещей не считается бизнесом"],
    correct:2,tricky:true,trickyNote:"Внимание — каверзный вопрос !",
    explanation:{correct:"Правильно! Продажа собственных личных вещей — не бизнес. Это не приносит прибыль, а лишь возвращает часть потраченного. Но если покупать вещи специально для перепродажи — это уже бизнес.",wrong:"Нет. Продажа личных вещей — не бизнес, ENK или AS не нужен. Но если покупать вещи специально для перепродажи — это уже предпринимательство."}
  },
  {
    emoji:"📊",
    text:"Сколько критериев использует Skatteetaten чтобы определить — хобби это или бизнес ?",
    options:["Один — оборот больше 50 000 kroner","4 — регулярность, цель прибыли, объём, собственный риск","2 — регулярность и размер дохода"],
    correct:1,tricky:false,
    explanation:{correct:"Правильно! Skatteetaten оценивает 4 критерия: цель заработка, регулярность, объём (не разовая акция), собственный риск. Если всё совпадает — это бизнес независимо от суммы.",wrong:"Нет. 50 000 kroner — это порог для MVA (НДС), не для определения бизнеса. Skatteetaten использует 4 критерия: цель заработка, регулярность, объём, собственный риск."}
  },
  {
    emoji:"💰",
    text:"До какой суммы в год от сдачи собственного жилья через Airbnb не платится налог ?",
    options:["50 000 kroner","10 000 kroner","15 000 kroner"],
    correct:2,tricky:true,trickyNote:"Внимание — многие путают цифры !",
    explanation:{correct:"Правильно! С 2025 года порог подняли с 10 000 до 15 000 kroner. Всё что выше — 85% от суммы сверх порога × 22%. 50 000 kroner — это порог для MVA, совсем другое.",wrong:"Нет. С 2025 года правильный ответ — 15 000 kroner. Раньше было 10 000. 50 000 kroner — это порог для MVA (НДС) — совсем другой вопрос."}
  },
  {
    emoji:"🧹",
    text:"Ира регулярно убирает квартиры за деньги. Помимо ENK или AS — что ещё нужно для легальной работы ?",
    options:["Ничего, ENK или AS достаточно","Разрешение от Mattilsynet","Регистрация в реестре клининговых компаний и разрешение от Arbeidstilsynet"],
    correct:2,tricky:false,
    explanation:{correct:"Правильно! Клининг — лицензируемая деятельность. Нужно: ENK или AS + регистрация в реестре клининговых компаний + карта HMS + разрешение от Arbeidstilsynet.",wrong:"Нет. Mattilsynet — это контроль за едой, не за клинингом. Для клининга нужно: ENK или AS + реестр клининговых компаний + карта HMS + разрешение от Arbeidstilsynet."}
  },
  {
    emoji:"🍕",
    text:"Таня хочет продавать домашние торты. Что нужно сделать ДО первой продажи ?",
    options:["ENK или AS + регистрация в Mattilsynet + отдельная рабочая зона + маркировка аллергенов","Только задекларировать доход в конце года","Ничего — сначала продаёт, потом разберётся с оформлением"],
    correct:0,tricky:false,
    explanation:{correct:"Правильно! Всё это нужно до первой продажи, не после. Mattilsynet проверяет и штрафует даже за первую партию тортов без регистрации.",wrong:"Нет. Продажа еды строго регулируется. Нужно: ENK или AS + Mattilsynet + отдельная рабочая зона + маркировка аллергенов — всё до первой продажи."}
  },
  {
    emoji:"📲",
    text:"Анна получает деньги от клиентов через Vipps на личный телефон. Видит ли это Skatteetaten ?",
    options:["Только если сумма больше 10 000 kroner за раз","Да — платежи через Vipps отслеживаются через банки","Нет — Vipps это личный кошелёк"],
    correct:1,tricky:true,trickyNote:"Внимание — каверзный вопрос !",
    explanation:{correct:"Правильно! Vipps работает через банки — все транзакции отслеживаются. Получать деньги через Vipps и не декларировать их — это прямой риск доначислений.",wrong:"Нет. Vipps работает через банки — все транзакции видны. Личный кошелёк не значит невидимый для налоговой."}
  },
  {
    emoji:"🎨",
    text:"Художник продаёт картины на ярмарках раз в месяц и продвигает себя в соцсетях. Нужен ли ENK или AS ?",
    options:["Нет — это хобби, искусство не считается бизнесом","Нет — зависит от суммы продаж","Да — регулярность + продвижение = бизнес"],
    correct:2,tricky:false,
    explanation:{correct:"Правильно! Регулярные продажи раз в месяц + активное продвижение = все 4 критерия Skatteetaten выполнены. Нужен ENK или AS. Для искусства есть отдельные правила учёта.",wrong:"Нет. Регулярность (раз в месяц) + продвижение в соцсетях = бизнес по норвежским законам. Нужен ENK или AS."}
  },
  {
    emoji:"⚠️",
    text:"Что может произойти если Skatteetaten найдёт незадекларированный доход ?",
    options:["Предупреждение в первый раз, штраф только во второй","Только штраф за текущий год","Доначисление за все прошлые годы + tilleggsskatt + проценты, возможны проблемы с ВНЖ"],
    correct:2,tricky:false,
    explanation:{correct:"Правильно! Skatteetaten может доначислить налог за все прошлые периоды + tilleggsskatt который фактически удваивает долг + проценты. Для иммигрантов — дополнительный риск для ВНЖ и гражданства.",wrong:"Нет. Никаких предупреждений в первый раз не существует. Doначисление за все прошлые годы + tilleggsskatt + проценты. Для иммигрантов — риск для ВНЖ."}
  }
];

let current=0,score=0,userAnswers=[],answered=false;

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').style.display='block';
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=questions[current];
  const pct=Math.round((current/questions.length)*100);
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('step-info').textContent=(current+1)+' из '+questions.length;
  const hint=q.tricky?`<div class="q-hint">⚡ ${q.trickyNote}</div>`:'';
  const opts=q.options.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pickAnswer(${i})"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('');
  document.getElementById('quiz').innerHTML=`<div class="card"><div class="q-eyebrow">${q.emoji} Вопрос ${current+1}</div><div class="q-text">${q.text}</div>${hint}<div class="options">${opts}</div><div id="exp"></div><div id="next-wrap"></div></div>`;
}

function pickAnswer(idx){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const ok=idx===q.correct;
  if(ok)score++;
  userAnswers.push({question:q.text,correct:ok,correctAnswer:q.options[q.correct]});
  q.options.forEach((_,i)=>{
    const b=document.getElementById('opt'+i);
    b.disabled=true;
    if(i===idx&&ok)b.classList.add('correct');
    if(i===idx&&!ok)b.classList.add('wrong');
    if(i===q.correct&&!ok)b.classList.add('reveal-correct');
  });
  const cls=ok?'correct-exp':'wrong-exp';
  const txt=ok?q.explanation.correct:q.explanation.wrong;
  document.getElementById('exp').innerHTML=`<div class="explanation ${cls}"><strong>${ok?'✓ Верно!':'✗ Неверно.'}</strong> ${txt}</div>`;
  const lbl=current<questions.length-1?'Следующий вопрос →':'Посмотреть результат →';
  document.getElementById('next-wrap').innerHTML=`<button class="btn-next" onclick="nextQuestion()">${lbl}</button>`;
}

function nextQuestion(){
  current++;
  if(current>=questions.length){showResult();return;}
  renderQuestion();
}

function showResult(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('step-info').textContent='Результат';
  document.getElementById('progress').style.width='100%';
  const pct=score/questions.length;
  let emoji,cls,subtitle,desc;
  if(pct>=0.8){emoji='🎉';cls='great';subtitle='Отличный результат !';desc='Вы хорошо разбираетесь в норвежских законах о бизнесе. Это поможет вам избежать штрафов и работать спокойно.';}
  else if(pct>=0.5){emoji='🤔';cls='ok';subtitle='Есть пробелы — стоит разобраться';desc='Базовые вещи вы знаете, но некоторые нюансы — именно те за которые штрафуют — пока не до конца понятны.';}
  else{emoji='😬';cls='bad';subtitle='Скорее всего, вы рискуете';desc='Именно такие пробелы приводят к доначислениям и штрафам от Skatteetaten. Хорошая новость — всё это можно изучить.';}
  const rows=userAnswers.map((a,i)=>`<div class="review-row"><div class="review-dot ${a.correct?'dot-c':'dot-w'}">${a.correct?'✓':'✗'}</div><div class="review-content"><strong>Вопрос ${i+1}</strong><span>${a.correct?'Верно':'Правильный ответ: '+a.correctAnswer}</span></div></div>`).join('');
  const el=document.getElementById('result');
  el.style.display='block';
  el.innerHTML=`
    <div class="score-card">
      <div class="score-emoji">${emoji}</div>
      <div class="score-label">Ваш результат</div>
      <div class="score-number ${cls}">${score} / ${questions.length}</div>
      <div class="score-subtitle">${subtitle}</div>
      <div class="score-desc">${desc}</div>
    </div>

    <div class="important-box">
      <div class="imp-label">⚠️ Важно запомнить</div>
      <div class="imp-title">Хобби — это не освобождение от налогов</div>
      <div class="imp-row">
        <span class="imp-icon">✅</span>
        <div class="imp-text">Хобби только разрешает <strong>не регистрировать</strong> ENK или AS</div>
      </div>
      <div class="imp-row">
        <span class="imp-icon">❌</span>
        <div class="imp-text">Хобби <strong>не освобождает</strong> от необходимости декларировать доход</div>
      </div>
      <div class="imp-row">
        <span class="imp-icon">💰</span>
        <div class="imp-text">Налог платить <strong>надо даже с хобби</strong> — если есть доход</div>
      </div>
    </div>

    <div class="review-section">
      <div class="review-title">Разбор ответов</div>
      ${rows}
    </div>

    <div class="cta-block">
      <h3>Хотите разобраться в бизнесе в Норвегии от А до Я ?</h3>
      <p>Курс совместно с авторизованным бухгалтером Марией Корслунд. ENK или AS на реальных цифрах, налоги, вычеты, бухгалтерские программы, годовая отчётность — всё на русском языке. Доступ сразу после оплаты.</p>
      <a class="cta-link" href="https://daria-norway.com/business">Узнать о курсе →</a>
      <div class="cta-note">Рассрочка до 6 месяцев · от 582 kroner в месяц</div>
    </div>

    <button class="btn-restart" onclick="restart()">Пройти тест заново</button>
  `;
}

function restart(){
  current=0;score=0;userAnswers=[];answered=false;
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  document.getElementById('progress').style.width='0%';
  renderQuestion();
}
</script>
</body>
</html>
